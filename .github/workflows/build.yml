name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle testDebugUnitTest assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk MeuFinanceiro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: meu-financeiro
          path: MeuFinanceiro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meu Financeiro (build ${{ github.run_number }})
          files: MeuFinanceiro.apk
          make_latest: true
